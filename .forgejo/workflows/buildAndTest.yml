# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net
name: Dotnet build and test

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
        - info
        - warning
        - debug
      tags:
        description: 'Test scenario tags'
        required: false
        type: boolean
  push:
    branches: [ "main", "release/*", "hotfix/*", "fix/*" ]
  pull_request:
    branches: [ "main", "release/*", "hotfix/*", "fix/*" ]

jobs:
  build:
    runs-on: docker
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          PGPORT: "55432"
        ports:
          - "55432:55432"
        options: >-
          --health-cmd="pg_isready -h 127.0.0.1 -p 55432 -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    container:
      image: pazof/yavsc-build-env:debian13-dotnet10-android36-jdk21-v5
    steps:
    - name: Clone yavsc
      run: |
        set -e
        cd /src
        git clone "${FORGEJO_SERVER_URL}/${FORGEJO_REPOSITORY}.git" _src
        cd _src
        if [ -n "${GITHUB_REF:-}" ]; then
          git fetch origin "$GITHUB_REF"
          git checkout FETCH_HEAD
        fi
        git submodule update --init --recursive
        echo "✅ Checked out at $(git rev-parse HEAD) on $(git branch --show-current 2>/dev/null || echo detached HEAD)"
    - name: Secret scan
      run: |
        echo "🔍 Scanning for secrets..."
        cd /src/_src && dotnet tool restore || true
        dotnet picket git --verbose --redact --exit-code 1 --log-opts main..HEAD
    - name: Build
      run: |
        echo "🏗️ Building the solution..."
        cd /src/_src && dotnet build --verbosity normal
    - name: Wait for PostgreSQL
      run: |
        echo "⏳ Waiting for PostgreSQL on 127.0.0.1:55432..."
        for i in $(seq 1 30); do
          if pg_isready -h 127.0.0.1 -p 55432 -U postgres >/dev/null 2>&1; then
            echo "✅ PostgreSQL is accepting connections"
            exit 0
          fi
          echo "PostgreSQL not ready yet ($i/30)"
          sleep 2
        done
        echo "❌ PostgreSQL did not become ready in time" >&2
        exit 1
    - name: Test
      env:
        YAVSC_API_TEST_DB_PROVIDER: npgsql
        YAVSC_API_TEST_NPGSQL_ADMIN_CONNECTION: Host=127.0.0.1;Port=55432;Database=postgres;Username=postgres;Password=postgres;Include Error Detail=true
      run: |
        echo "🚀 Lancement des tests..."
        cd /src/_src && dotnet test \
          --report-xunit \
          --report-xunit-html \
          --report-xunit-html-filename "test-results.html"
        TEST_EXIT_CODE=$?
        echo "Test exit code: $TEST_EXIT_CODE"
        if [ $TEST_EXIT_CODE -ne 0 ]; then
          echo "❌ Tests failed with exit code $TEST_EXIT_CODE"
          exit $TEST_EXIT_CODE
        else
          echo "✅ All tests passed successfully."
        fi
