# MediaMTX v1.21.3. Run beside the single Yavsc.Api media host.
# Replace the auth URL port and TLS certificate paths for the deployment.
logLevel: warn
authMethod: http
authHTTPAddress: http://127.0.0.1:5103/api/v1/podcasts/relay/auth
authHTTPExclude: []
api: true
apiAddress: 127.0.0.1:9997
rtsp: false
rtmp: true
rtmpEncryption: optional
rtmpAddress: 127.0.0.1:1935
rtmpsAddress: :1936
rtmpServerKey: /etc/yavsc/obs/server.key
rtmpServerCert: /etc/yavsc/obs/server.crt
hls: false
webrtc: false
srt: false
playback: false
pathDefaults:
  source: publisher
  overridePublisher: false
  maxReaders: 1
  record: false
paths:
  "~^obs/[0-9a-f]{32}$":
